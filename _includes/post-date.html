{% if include.entry.date_precision == 'month' %}
  <p class="page__date"><strong><i class="fa fa-fw fa-calendar" aria-hidden="true"></i></strong> <time datetime="{{ include.entry.date | date: '%Y-%m' }}">{{ include.entry.date | date: '%B %Y' }}</time></p>
{% else %}
  <p class="page__date"><strong><i class="fa fa-fw fa-calendar" aria-hidden="true"></i> {{ site.data.ui-text[site.locale].date_label | default: "Published:" }}</strong> <time datetime="{{ include.entry.date | date_to_xmlschema }}">{{ include.entry.date | date: "%B %d, %Y" }}</time></p>
{% endif %}
