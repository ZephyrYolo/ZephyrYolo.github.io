{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
{% if page.layout == 'home-profile' %}
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
{% endif %}
{% case page.section_name %}
  {% when 'publications', 'news' %}
    <link rel="stylesheet" href="{{ '/assets/css/academic-lists.css' | relative_url }}">
  {% when 'cv' %}
    <link rel="stylesheet" href="{{ '/assets/css/academic-cv.css' | relative_url }}">
  {% when 'photography' %}
    <link rel="stylesheet" href="{{ '/assets/css/academic-photography.css' | relative_url }}">
{% endcase %}
